<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeviceMind · 设备说明书编译器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🧠</span>
      <div class="brand-text">
        <h1>DeviceMind</h1>
        <span class="tagline">贴说明书，生成 Home Assistant 设备协议</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">连接中…</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="compile">编译设备</button>
    <button class="tab" data-tab="devices">已编译设备</button>
  </nav>

  <main>
    <!-- 编译设备 -->
    <section id="tab-compile" class="tab-panel active">
      <div class="panel-head">
        <h2>编译设备说明书</h2>
        <span class="muted">把设备说明书交给 AI，编译成结构化设备协议</span>
      </div>
      <div class="add-wrap">
        <div class="field">
          <label>设备名称（可选，帮助 AI 定位）</label>
          <input id="name-hint" type="text" placeholder="如：格力空调">
        </div>
        <div class="field">
          <label>设备 ID（可选，留空自动生成）</label>
          <input id="device-id" type="text" placeholder="如：ac-02">
        </div>
        <div class="field">
          <label>说明书内容</label>
          <textarea id="manual" rows="8" placeholder="把设备说明书的文字粘贴到这里…"></textarea>
        </div>
        <div class="field">
          <label>或选择一份示例说明书</label>
          <div class="samples" id="samples"></div>
        </div>
        <button class="btn primary" id="btn-compile">🔍 编译设备协议</button>
        <button class="btn" id="btn-save" disabled>💾 保存到缓存</button>
        <div id="compile-result" class="add-result"></div>
      </div>
    </section>

    <!-- 已编译设备 -->
    <section id="tab-devices" class="tab-panel">
      <div class="panel-head">
        <h2>已编译设备</h2>
        <span class="muted">复制协议 JSON，导入 Home Assistant</span>
      </div>
      <div id="devices-list" class="devices-list"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
